# Azure Developer CLI definition for the SREinProd workshop.
#
# Workload: Azure-Samples/app-service-dotnet-agent-tutorial
# https://github.com/Azure-Samples/app-service-dotnet-agent-tutorial
#
# IMPORTANT: azd validates services.app.project at INIT time, before any
# hook can fire. You must clone the sample BEFORE running `azd up`:
#
#     pwsh ./scripts/clone-sample-app.ps1
#     azd up
#
# The `preprovision` hook below is a safety net that refreshes the clone
# to the latest upstream commit on every `azd up`; it is not a first-run
# installer.

name: sreinprod
metadata:
  template: sreinprod@0.2.0

infra:
  provider: bicep
  path: infra
  module: main

services:
  app:
    project: ./sample-app
    language: dotnet
    host: appservice

hooks:
  preprovision:
    windows:
      shell: pwsh
      run: ./scripts/clone-sample-app.ps1
      continueOnError: false
      interactive: false
    posix:
      shell: sh
      run: pwsh ./scripts/clone-sample-app.ps1
      continueOnError: false
      interactive: false

  postdeploy:
    windows:
      shell: pwsh
      run: ./scripts/deploy-to-slot.ps1 -SlotName staging
      continueOnError: true
      interactive: false
    posix:
      shell: sh
      run: pwsh ./scripts/deploy-to-slot.ps1 -SlotName staging
      continueOnError: true
      interactive: false

